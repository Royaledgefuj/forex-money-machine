<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>Reset Password | Forex Money Machine Academy</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=8">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="auth-body">

<div class="bg-noise" aria-hidden="true"></div>

<div class="auth-shell">
  <div class="auth-panel">
    <a href="index.html" class="brand auth-brand">
      <img src="assets/logo.png" alt="Forex Money Machine Academy" class="brand-logo">
    </a>

    <h1 class="auth-title">Set a New Password</h1>
    <p class="auth-sub" id="resetIntro">Choose a new password for your account.</p>

    <form id="resetForm" class="auth-form">
      <label>New Password
        <input type="password" id="newPassword" placeholder="Minimum 6 characters" required minlength="6">
      </label>
      <label>Confirm New Password
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="6">
      </label>
      <p class="auth-error" id="resetError" hidden></p>
      <button type="submit" class="btn btn-gold btn-lg auth-submit" id="resetSubmitBtn">Set New Password</button>
      <p class="auth-note"><a href="login.html" class="auth-link">Back to login</a></p>
    </form>

    <div id="resetSuccess" hidden>
      <p class="auth-sub">Your password has been updated.</p>
      <a href="login.html" class="btn btn-gold btn-lg auth-submit" style="display:flex;">Go to Login</a>
    </div>
  </div>

  <div class="auth-side">
    <div class="auth-side-content">
      <p class="eyebrow"><span class="eyebrow-dot"></span>1,000+ Traders Trained</p>
      <h2>Trade With an Edge</h2>
      <p>Set a new password to get back into your courses, tools and live classes.</p>
    </div>
  </div>
</div>

<script src="js/auth.js?v=7"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('resetForm');
  const errorEl = document.getElementById('resetError');

  if (!token) {
    document.getElementById('resetIntro').textContent = 'This reset link is missing its token — please request a new one from the login page.';
    form.hidden = true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const submitBtn = document.getElementById('resetSubmitBtn');
    errorEl.hidden = true;

    if (newPassword !== confirmPassword) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    try {
      await apiFetch('/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, newPassword }) });
      form.hidden = true;
      document.getElementById('resetSuccess').hidden = false;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
